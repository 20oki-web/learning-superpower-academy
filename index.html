<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Superpower Academy</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7fb,#0d1220);--panel:light-dark(#fff,#151c2d);--panel2:light-dark(#eef3fa,#1b2539);--text:light-dark(#142033,#f4f7ff);--muted:light-dark(#5d6b80,#aab7cc);--line:light-dark(#d7dfeb,#2b3850);--accent:#6d5dfc;--accent2:#19b5fe;--good:#18a673}*{box-sizing:border-box}body{margin:0;font-family:"PT Serif",Georgia,serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background-color:var(--bg);border-radius:0}.wrap{width:min(980px,calc(100% - 32px));margin:auto;padding:28px 0 44px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-family:"PT Serif",Georgia,serif;font-weight:900;letter-spacing:.06em;font-size:13px}.progress{font-size:12px;color:var(--muted);font-weight:800}.hero{padding:clamp(28px,6vw,64px) 0 30px;text-align:center}.badge{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-size:12px;font-weight:800;color:var(--accent)}h1{font-size:clamp(38px,8vw,74px);line-height:.95;margin:20px 0 18px;letter-spacing:-.05em}h2{font-size:clamp(28px,5vw,48px);line-height:1;margin:8px 0 14px;letter-spacing:-.035em}.lead{max-width:700px;margin:0 auto;color:var(--muted);font-size:17px;line-height:1.65}.btn{border:0;border-radius:3px;padding:15px 20px;font-weight:900;cursor:pointer;background:var(--accent);color:white;font-size:15px;box-shadow:0 8px 24px #6d5dfc33}.btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:none}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}.note{font-size:12px;color:var(--muted);max-width:650px;margin:18px auto 0;line-height:1.5}.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:24px;box-shadow:0 12px 35px #0000000a}.question{max-width:760px;margin:30px auto}.qnum{color:var(--accent);font-weight:900;font-size:12px;letter-spacing:.08em}.choices{display:grid;gap:12px;margin-top:24px}.choice{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:17px 18px;border-radius:3px;cursor:pointer;font-size:15px;line-height:1.4;transition:.15s}.choice:hover{border-color:var(--accent);transform:translateY(-1px)}.choice span{display:inline-flex;width:29px;height:29px;border-radius:3px;align-items:center;justify-content:center;background:var(--panel2);font-weight:900;margin-right:10px;color:var(--accent)}.resultGrid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.power{font-size:clamp(34px,7vw,64px);font-weight:950;letter-spacing:-.05em;margin:6px 0}.sub{color:var(--muted);font-weight:800}.bars{display:grid;gap:15px;margin-top:22px}.barrow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:13px;font-weight:800}.track{height:12px;border-radius:2px;background:var(--panel2);overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px}.profile p,.resource p{color:var(--muted);line-height:1.6}.resourceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:18px}.resource h3{margin:0 0 6px}.tag{display:inline-block;font-size:11px;font-weight:900;padding:5px 8px;border-radius:3px;background:var(--panel2);color:var(--accent);margin-bottom:10px}.resource a{display:inline-block;margin-top:8px;color:var(--accent);font-weight:900;text-decoration:none}.footer{text-align:center;margin-top:34px}.hidden{display:none}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:12px;font-weight:800}.mission{font-size:clamp(24px,5vw,42px);font-weight:950;letter-spacing:-.04em}.small{font-size:13px;color:var(--muted)}@media(max-width:700px){.wrap{width:min(100% - 22px,980px);padding-top:18px}.resultGrid,.resourceGrid{grid-template-columns:1fr}.card{padding:19px;border-radius:3px}.barrow{grid-template-columns:105px 1fr 42px;font-size:12px}.btn{width:100%;max-width:360px}.actions{align-items:center}.lead{font-size:15px}h1{font-size:clamp(40px,13vw,62px)}}
</style></head><body><main id="app"><div class="wrap"><div class="top"><div class="brand">HERO ACADEMY // LEARNING LAB</div><div id="progress" class="progress"></div></div><section id="screen"></section></div></main><script>
const powers=[['Visual','The Visionary','👁️'],['Kinesthetic','The Catalyst','⚡'],['Auditory','The Echo','🔊'],['Social','The Alliance','🤝'],['Reflective','The Mind','🧠']];
const qs=[
['You’re introduced to a difficult new concept. What would help you understand it first?',['Seeing a diagram, animation, or visual example','Trying an example or activity myself','Having someone explain it aloud','Talking through the idea with someone else','Having quiet time to think about it myself']],
['You need to remember a complicated process. What would you rather use?',['A flowchart or labelled diagram','Actually performing the process','Listening to an explanation','Explaining it to a friend','Writing the steps and reviewing them quietly']],
['You’re stuck on a difficult homework problem. What is your first instinct?',['Look for a diagram or worked visual example','Try different approaches','Ask someone to explain it aloud','Discuss it with a friend or classmate','Sit with the problem and work through it alone']],
['Which study activity sounds most useful to you?',['Making a mind map or infographic','Doing practice problems or an experiment','Listening to a lesson or explanation','Studying with friends and discussing ideas','Reviewing notes alone and thinking about them']],
['When you get something wrong, what helps you understand your mistake?',['Seeing exactly where the mistake happened','Trying again with a different method','Having the mistake explained','Talking through the mistake with someone','Looking back at your reasoning']],
['You have to learn a new skill. Which approach would you choose?',['Watch a demonstration','Start doing it yourself','Listen to instructions first','Learn alongside someone','Study the instructions and plan before starting']],
['Which classroom activity would probably keep you most engaged?',['Diagrams, presentations, or visual projects','An experiment or building activity','Listening to an explanation or presentation','A discussion or debate','An individual investigation']],
['You have a test next week. How would you most likely review?',['Diagrams, colour coding, charts, or visual summaries','Lots of practice questions','Explain it aloud or listen to explanations','Quiz a friend or have them quiz you','Study alone and review your gaps']],
['Which environment would you probably prefer for studying?',['A space with visual reminders and organised materials','A space where you can move around and take active breaks','A place where you can listen to explanations without distraction','Somewhere with other people','A quiet independent space']],
['After learning something, how do you usually check whether you understand it?',['Picture how the concept works','Use the concept in a practical example','Explain the concept aloud','Explain it to another person or answer questions','Explain it to yourself and identify gaps']],
['Imagine you have one hour to learn something completely new. Which sounds most appealing?',['Watching demonstrations plus a visual summary','Experimenting through trial and error','Listening to an interesting explanation','Learning with a partner or group','Exploring independently at your own pace']],
['Your final training challenge: what makes a study method feel genuinely useful to you?',['I can SEE how everything connects.','I can actually DO something with what I learned.','I can HEAR and explain the idea clearly.','I can TALK through the idea and learn from other perspectives.','I have TIME TO THINK and understand it in my own way.']]
];
let i=0,scores=[0,0,0,0,0];const screen=document.getElementById('screen'),prog=document.getElementById('progress');
function intro(){prog.textContent='';screen.innerHTML=`<section class="hero"><div class="badge">TRAINING ASSESSMENT</div><h1>WHAT’S YOUR<br>LEARNING<br>SUPERPOWER?</h1><p class="lead">Every hero has a superpower. Yours might not be super strength, flight, or invisibility. It might be something much more useful: the way you learn.</p><p class="lead">Answer 12 challenges about how you understand, practise, remember, and process information. At the end, you’ll unlock your Learning Superpower and a Power Profile.</p><div class="actions"><button class="btn" onclick="start()">BEGIN YOUR TRAINING →</button></div><p class="note">This quiz identifies learning preferences, not fixed abilities. Your result is a starting point for discovering study methods that work well for you.</p></section>`}
function start(){i=0;scores=[0,0,0,0,0];question()}
function question(){prog.textContent=`TRAINING PROGRESS  ${String(i+1).padStart(2,'0')} / 12`;let q=qs[i];screen.innerHTML=`<section class="question card"><div class="qnum">CHALLENGE ${i+1} OF 12</div><h2>${q[0]}</h2><div class="choices">${q[1].map((x,k)=>`<button class="choice" onclick="answer(${k})"><span>${'ABCDE'[k]}</span>${x}</button>`).join('')}</div></section>`}
function answer(k){scores[k]++;i++;if(i<qs.length)question();else results()}
function results(){prog.textContent='TRAINING COMPLETE';let max=Math.max(...scores), tops=scores.map((v,j)=>v===max?j:-1).filter(x=>x>=0), primary=tops[0];let sorted=[...scores].sort((a,b)=>b-a),secondary=sorted[1]!==undefined&&sorted[0]-sorted[1]<=2&&tops.length===1?scores.indexOf(sorted[1]):-1;let title=tops.length>1?'BALANCED PROFILE':powers[primary][1];let label=tops.length>1?'Your strongest preferences are closely balanced':powers[primary][0]+' Learning Preference';let desc={Visual:'You may find it easier to organise ideas when you can see how they connect.',Kinesthetic:'You may learn well by interacting with ideas through practice, experimentation, and application.',Auditory:'You may process ideas well through listening, discussion, and explaining things aloud.',Social:'You may learn well when ideas become conversations, collaboration, and shared problem-solving.',Reflective:'You may prefer independent processing, reflection, self-testing, and working at your own pace.'};let hone={Visual:'Try mind maps, flowcharts, timelines, diagrams, charts, colour-coded notes, visual summaries, and turning written information into visual structures.',Kinesthetic:'Try practice questions, simulations, models, demonstrations, projects, trial and error, practical examples, and active study breaks.',Auditory:'Try recorded explanations, reading notes aloud, verbal rehearsal, discussions, lectures, and explaining concepts aloud.',Social:'Try study groups, peer teaching, discussions, debates, quiz partners, collaborative projects, and comparing approaches.',Reflective:'Try quiet study sessions, reviewing mistakes, self-testing, independent summaries, learning goals, and planning your next session.'};screen.innerHTML=`<section class="hero" style="padding-bottom:20px"><div class="badge">⚡ SUPERPOWER UNLOCKED</div><div class="power">${tops.length>1?'🦸 '+title:powers[primary][2]+' '+title}</div><div class="sub">${label}</div><div class="chips">${tops.map(x=>`<div class="chip">${powers[x][2]} ${powers[x][0]} ${scores[x]}/12</div>`).join('')}</div></section><section class="resultGrid"><div class="card"><h2>YOUR POWER PROFILE</h2><p class="small">Scores show your preferences based on your answers — not intelligence, ability, or academic potential.</p><div class="bars">${powers.map((p,j)=>`<div class="barrow"><div>${p[2]} ${p[1]}</div><div class="track"><div class="fill" style="width:${scores[j]/12*100}%"></div></div><div>${scores[j]}/12</div></div>`).join('')}</div></div><div class="card profile"><h2>HOW TO HONE YOUR POWER</h2>${tops.length>1?'<p>Your profile is balanced. Experiment with the techniques below and notice which ones genuinely help you learn.':`<p><b>${powers[primary][1]}:</b> ${desc[powers[primary][0]]}</p><p><b>Training techniques:</b> ${hone[powers[primary][0]]}</p>`}${secondary>=0?`<p><b>Secondary power:</b> ${powers[secondary][1]} (${scores[secondary]}/12). Mix both approaches when useful.</p>`:''}</div></section><section class="card" style="margin-top:18px"><h2>📚 RESOURCE VAULT</h2><p class="small">Training equipment to help you experiment with different ways of learning.</p><div class="resourceGrid">${resources().map(r=>`<article class="resource card"><div class="tag">${r[0]}</div><h3>${r[1]}</h3><p>${r[2]}</p><a href="${r[3]}" target="_blank" rel="noopener">EXPLORE RESOURCE →</a></article>`).join('')}</div></section><section class="footer"><p class="mission">🦸 MISSION COMPLETE</p><p class="lead">The strongest heroes aren’t the ones who only use one ability. They’re the ones who know when to use the right one.</p><div class="actions"><button class="btn" onclick="start()">↻ RETRAIN</button><button class="btn secondary" onclick="intro()">🏠 RETURN TO THE HERO ACADEMY</button></div></section>`}
function resources(){return [['VISUAL','Visual Learning: Effective Strategies and Best Practices','Use diagrams, graphics, images, charts, and other visual representations to support understanding.','https://www.instructure.com/en-au/resources/blog/visual-learning-effective-strategies-and-best-practices'],['KINESTHETIC','Active Learning','Practise concepts by doing: solve problems, apply ideas, build, test, discuss, and receive feedback rather than only rereading.','https://poorvucenter.yale.edu/teaching/teaching-resource-library/active-learning'],['AUDITORY','Effective Lecturing','Use spoken explanations, lectures, verbal rehearsal, and discussion as ways to process and revisit ideas.','https://poorvucenter.yale.edu/teaching/teaching-resource-library/effective-lecturing'],['SOCIAL','Collaborative Learning','Use discussion, peer teaching, group problem-solving, and collaboration to explore ideas from multiple perspectives.','https://teaching.cornell.edu/teaching-resources/active-collaborative-learning/collaborative-learning'],['REFLECTIVE','Metacognition','Reflect on what you know, identify gaps, review your strategies, and plan how to improve your learning.','https://poorvucenter.yale.edu/teaching/teaching-resource-library/teaching-how-to/teaching-how-to-chapter-4-engaging-students-in-0']]}intro();
</script></body></html>
